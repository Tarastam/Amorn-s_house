<title>Amorn Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Manrope:wght@500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed warm isometric dollhouse on a floating lot. Sky + light follow the viewer's clock. All project data lives on the in-house TV (full-screen overlay). Single committed light look. */
:root{
  --bg:#f3e9da; --panel:rgba(255,251,244,.93); --solid:#fffdf8; --ink:#2e2638; --muted:#7d7385; --line:#eadfce;
  --accent:#c9553b; --accent-soft:#fbe8df; --gold:#f0b429;
  --good:#1f8a5b; --good-bg:#def3e8; --warn:#8f5605; --warn-bg:#fdefd0; --blue:#2f63b8; --blue-bg:#e6edfb; --idle:#6a6478; --idle-bg:#eeeaf3;
  --f-ui:'Manrope','Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --shadow:0 10px 30px rgba(70,40,20,.16),0 1px 2px rgba(70,40,20,.08);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased;touch-action:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{position:relative;height:100%;width:100%;overflow:hidden}
.sky{position:absolute;inset:0;background:linear-gradient(#7ec3f2,#e4f3fb);overflow:hidden}
.stars{position:absolute;inset:0;opacity:0;background-image:radial-gradient(1.4px 1.4px at 8% 12%,#fff,transparent),radial-gradient(1px 1px at 22% 30%,#fff,transparent),radial-gradient(1.6px 1.6px at 37% 8%,#fff,transparent),radial-gradient(1px 1px at 51% 22%,#fff,transparent),radial-gradient(1.4px 1.4px at 66% 11%,#fff,transparent),radial-gradient(1px 1px at 78% 28%,#fff,transparent),radial-gradient(1.6px 1.6px at 90% 9%,#fff,transparent),radial-gradient(1px 1px at 14% 44%,#fff,transparent),radial-gradient(1px 1px at 58% 41%,#fff,transparent),radial-gradient(1.2px 1.2px at 96% 38%,#fff,transparent)}
.orb{position:absolute;width:54px;height:54px;border-radius:50%;left:20%;top:12%;transition:background .6s;box-shadow:0 0 50px 14px var(--glow,rgba(255,230,150,.6))}
.cloud{position:absolute;height:22px;border-radius:22px;background:#fff;opacity:.8;filter:blur(.5px);animation:drift 120s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:34px;height:34px;left:14px;top:-17px}.cloud::after{width:26px;height:26px;left:44px;top:-10px}
.c1{width:90px;top:10%;left:-120px;animation-delay:-20s}.c2{width:70px;top:19%;left:-120px;animation-delay:-70s;animation-duration:150s}.c3{width:110px;top:6%;left:-120px;animation-delay:-105s;animation-duration:180s}
@keyframes drift{to{transform:translateX(calc(100vw + 260px))}}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#gl.drag{cursor:grabbing}#gl.hov{cursor:pointer}
.glass{background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.85);border-radius:16px;box-shadow:var(--shadow)}
.cap{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.num{font-variant-numeric:tabular-nums}

.top{position:absolute;left:16px;right:16px;top:12px;height:50px;display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;z-index:20}
.logo{display:flex;align-items:center;gap:9px;white-space:nowrap;font-weight:800;font-size:16px;letter-spacing:-.02em}
.logo .mk{width:30px;height:30px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:16px}
.logo small{display:block;font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:0;line-height:1}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:10px;font-weight:700;font-size:12.5px;border:1px solid var(--line);background:#fff;white-space:nowrap}
.btn:hover{background:var(--accent-soft)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.pri:hover{background:#b24a32}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.dark:hover{background:#463a56}
.btn.danger{color:#b8302f}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.clock{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:12.5px}
.clock:hover{background:var(--accent-soft)}
.clock b{font-family:var(--f-mono);font-weight:500;font-size:13px}
.clock small{color:var(--muted);font-weight:600}
.timebar{position:absolute;right:16px;top:70px;z-index:20;padding:10px 12px;display:none;align-items:center;gap:10px;width:300px}
.timebar.on{display:flex}
.timebar input{flex:1;accent-color:var(--accent)}
.timebar span{font-family:var(--f-mono);font-size:12px;min-width:42px}

.chips{position:absolute;left:16px;top:72px;display:flex;gap:4px;z-index:10;padding:5px;max-width:calc(100% - 32px);overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:10px;font-weight:700;font-size:12px;white-space:nowrap;color:#4a4256}
.chip i{width:9px;height:9px;border-radius:3px;background:var(--c,var(--ink))}
.chip:hover{background:var(--accent-soft)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}

.legend{position:absolute;left:16px;bottom:16px;padding:12px 14px;z-index:10;display:grid;grid-template-columns:auto auto;gap:6px 18px;font-size:11.5px}
.legend .cap{grid-column:1/-1}
.legend span{display:flex;align-items:center;gap:7px;color:#4a4256}
.legend svg{width:16px;height:16px}
.zoom{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;padding:4px;gap:2px;z-index:10;border-radius:12px}
.zoom button{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:17px;color:#3a3246}
.zoom button:hover{background:var(--accent-soft)}

.card{position:absolute;left:50%;bottom:18px;transform:translate(-50%,16px);width:min(440px,calc(100% - 24px));padding:14px 16px;z-index:30;opacity:0;pointer-events:none;transition:.28s}
.card.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.card h3{margin:2px 0 0;font-size:18px;letter-spacing:-.02em;line-height:1.25}
.card .row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.card .x{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted);font-size:16px}
.card .x:hover{background:var(--accent-soft)}
.card .next{margin-top:10px;font-size:12.5px;color:#4a4256;background:#f7f0e6;border-radius:10px;padding:8px 10px}
.card .next b{font-weight:700}
.card .acts{display:flex;gap:8px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.blue{background:var(--blue-bg);color:var(--blue)}.pill.idle{background:var(--idle-bg);color:var(--idle)}
.bar{height:7px;border-radius:7px;background:#eadfce;overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:7px;background:var(--c,var(--accent));transition:width .4s}

.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.lab{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
.bLab{display:flex;align-items:center;gap:6px;background:var(--solid);border-radius:8px;padding:3px 8px 3px 6px;box-shadow:0 3px 10px rgba(70,40,20,.18);font-size:11px;font-weight:700;border:1px solid var(--line);pointer-events:auto;cursor:pointer}
.bLab i{width:8px;height:8px;border-radius:3px;background:var(--c)}
.bLab small{color:var(--muted);font-weight:700;font-family:var(--f-mono)}
.bLab.sel{background:var(--ink);color:#fff;border-color:var(--ink)}.bLab.sel small{color:#e6dcf3}
.bLab.dim{opacity:.35}
.dLab{font-weight:800;font-size:12px;letter-spacing:.02em;padding:4px 10px;border-radius:8px;color:#fff;background:var(--c);box-shadow:0 3px 10px rgba(70,40,20,.22);pointer-events:auto;cursor:pointer}
.amLab{font-size:11px;font-weight:700;background:var(--ink);color:#fff;padding:3px 9px;border-radius:999px;box-shadow:0 3px 10px rgba(40,20,10,.3);display:flex;gap:6px;align-items:center;max-width:230px}
.amLab span{overflow:hidden;text-overflow:ellipsis}
.amLab i{width:7px;height:7px;border-radius:50%;background:#7be0a6;flex:none}
.toast{position:absolute;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:calc(100% - 32px);font-size:12px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hint{position:absolute;left:50%;top:128px;transform:translateX(-50%);z-index:9;padding:8px 14px;font-size:12px;font-weight:600;color:#4a4256;opacity:0;pointer-events:none;transition:.5s;white-space:nowrap}
.hint.on{opacity:1}

/* ---------- TV ---------- */
.tv{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:3.5vh 3.5vw;background:rgba(26,16,10,0);transition:background .4s}
.tv.on{display:flex}.tv.show{background:rgba(26,16,10,.45)}
.bezel{width:100%;height:100%;max-width:1320px;background:#15161d;border-radius:28px;padding:14px;box-shadow:0 30px 80px rgba(20,10,5,.55),inset 0 0 0 2px #2c2e3b;transform:scale(.62);opacity:0;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .35s;position:relative}
.tv.show .bezel{transform:none;opacity:1}
.bezel::after{content:"";position:absolute;left:50%;bottom:4px;width:5px;height:5px;border-radius:50%;background:#3d4052;transform:translateX(-50%)}
.screen{--tv:#10131c;--tv2:#1a1e2c;--tv3:#242938;--tl:#2e3448;--ti:#eeebf6;--tm:#a09db4;--ta:#f0a23c;
  height:100%;border-radius:16px;background:var(--tv);color:var(--ti);display:grid;grid-template-columns:196px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);overflow:hidden}
.tvTop{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--tl);background:linear-gradient(#171b29,#10131c)}
.tvTop .ttl{font-weight:800;font-size:15px;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.tvTop .ttl i{width:9px;height:9px;border-radius:50%;background:#ff5d5d;box-shadow:0 0 10px #ff5d5d}
.tvTop .tt{font-family:var(--f-mono);font-size:12px;color:var(--tm)}
.tvTop .sp{flex:1}
.tvb{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:9px;background:var(--tv3);color:var(--ti);font-weight:700;font-size:12px;border:1px solid var(--tl);white-space:nowrap}
.tvb:hover{background:#2f3550}
.tvb.pri{background:var(--ta);color:#241504;border-color:var(--ta)}.tvb.pri:hover{background:#ffb455}
.tvb.danger{color:#ff8e8e}
.tvb.sm{height:28px;padding:0 9px;font-size:11.5px}
.tvNav{display:flex;flex-direction:column;gap:4px;padding:12px 10px;border-right:1px solid var(--tl);background:#0d1018;overflow:auto}
.tvNav button{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border-radius:11px;color:var(--tm);font-weight:700;font-size:13px;text-align:left}
.tvNav button small{margin-left:auto;font-family:var(--f-mono);font-weight:500;font-size:11px;opacity:.85}
.tvNav button:hover{background:var(--tv2);color:var(--ti)}
.tvNav button[aria-selected=true]{background:var(--ta);color:#241504}
.tvMain{overflow:auto;padding:18px 22px 28px;min-width:0;scrollbar-width:thin;scrollbar-color:#3a4058 transparent;touch-action:pan-y}
.tvMain h2{margin:0;font-size:22px;letter-spacing:-.02em;line-height:1.25}
.tvMain .sub{color:var(--tm);margin:4px 0 0;font-size:12.5px}
.tvMain .cap{color:var(--tm)}

.board{background:#22382f;border:8px solid #b98a5c;border-radius:12px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.2);padding:14px 16px 16px;color:#eef3ea;--qfg:#eef3ea;--qdim:#8fa59a;margin-top:14px}
.bHead{display:flex;align-items:baseline;gap:8px}
.bHead b{font-size:16px;letter-spacing:.16em;text-transform:uppercase}
.bHead span{margin-left:auto;font-family:var(--f-mono);font-size:13px;color:var(--qdim)}
.bBar{height:5px;border-radius:5px;background:rgba(255,255,255,.14);margin:8px 0 12px;overflow:hidden}
.bBar i{display:block;height:100%;background:#eef3ea;border-radius:5px;transition:width .4s}
.qAdd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:8px;margin-bottom:8px}
.qAdd select,.qAdd input{height:34px;border-radius:8px;border:1px dashed rgba(238,243,234,.45);background:rgba(255,255,255,.06);color:#eef3ea;padding:0 10px;font-size:13px;min-width:0}
.qAdd select{font-weight:600}.qAdd select option{color:#2e2638}
.qAdd input::placeholder{color:#8fa59a}
.qAdd button{height:34px;padding:0 14px;border-radius:8px;background:#eef3ea;color:#22382f;font-weight:800;font-size:12.5px}
.qCols{columns:2 300px;column-gap:26px}
.qGroup{margin-top:12px;break-inside:avoid}
.qG{display:flex;align-items:center;gap:8px;font-weight:800;font-size:12.5px;color:var(--c);letter-spacing:.02em;filter:brightness(1.35) saturate(.9)}
.qG i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.qG small{margin-left:auto;color:var(--qdim);font-family:var(--f-mono);font-weight:500;filter:none}
.none{color:var(--qdim);font-size:12px;padding:4px 0 0 16px}
.q{display:flex;align-items:flex-start;gap:9px;padding:6px 0 6px 2px;cursor:pointer;position:relative}
.q input{position:absolute;opacity:0;pointer-events:none}
.q .ck{width:17px;height:17px;border:2px solid var(--qfg);border-radius:4px;margin-top:2px;flex:none;display:grid;place-items:center;transition:background .2s}
.q .ck::after{content:"";width:8px;height:4px;border-left:2px solid #22382f;border-bottom:2px solid #22382f;transform:rotate(-45deg) scale(0);margin-top:-2px;transition:transform .2s}
.q.done .ck{background:var(--qfg)}.q.done .ck::after{transform:rotate(-45deg) scale(1)}
.q .tx{flex:0 1 auto;min-width:0;font-size:13.5px;line-height:1.5;font-weight:500;color:var(--qfg);padding-bottom:1px;background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0% 2px;transition:background-size .4s ease,color .3s}
.q.done .tx{background-size:100% 2px;color:var(--qdim)}
.q .qx{opacity:0;color:var(--qdim);font-size:17px;line-height:1;padding:0 6px;margin-top:1px;margin-left:auto}
.q:hover .qx,.q:focus-within .qx{opacity:1}
.q input:focus-visible+.ck{outline:2px solid #eef3ea;outline-offset:2px}
.onTv{--qfg:var(--ti);--qdim:var(--tm)}
.onTv .q .ck::after{border-color:var(--tv)}

.tvc{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:14px;background:var(--tv2);border:1px solid var(--tl);color:inherit}
button.tvc:hover{border-color:var(--c,var(--ta));background:#212638}
.tvc .r{display:flex;align-items:center;gap:9px}
.tvc .sw{width:10px;height:10px;border-radius:3px;background:var(--c)}
.tvc b{font-size:13.5px}.tvc small{color:var(--tm);margin-left:auto;font-size:11.5px}
.tvc .bar{background:#2c3248;margin-top:9px;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}
.grp{margin-top:20px}
.grp>.cap{display:flex;align-items:center;gap:8px;color:var(--c)}
.grp>.cap i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.kp div{background:var(--tv2);border:1px solid var(--tl);border-radius:14px;padding:12px 14px}
.kp .kl{font-size:11.5px;color:var(--tm);font-weight:600}
.kp b{display:block;font-size:26px;letter-spacing:-.03em;line-height:1.2}
.kp small{color:var(--tm);font-size:11px}
.pill.tvp{background:var(--tv3);color:var(--ti)}
.pill.tvp.good{background:#143a2c;color:#7be0a6}.pill.tvp.warn{background:#3d2d0b;color:#ffcf6a}.pill.tvp.blue{background:#162a4d;color:#8db4ff}.pill.tvp.idle{background:#2b2a38;color:#b6b2c8}
.frm{display:flex;flex-direction:column;gap:12px;margin-top:14px;max-width:460px}
.frm label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;font-weight:700;color:var(--tm)}
.frm input[type=text],.frm input[type=number],.frm select{height:38px;border:1px solid var(--tl);background:var(--tv2);border-radius:10px;padding:0 11px;font-size:13.5px;font-weight:500;color:var(--ti);width:100%}
.frm select option{color:#2e2638}
.frm input[type=range]{width:100%;accent-color:var(--ta)}
.frm .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--tm);font-weight:700;font-size:12px;margin-bottom:10px}
.back:hover{color:var(--ti)}
.big{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1;margin-top:14px}
.big small{font-size:15px;color:var(--tm);font-weight:700;letter-spacing:0}

/* weekly routines */
.rt{margin-top:16px;background:var(--tv2);border:1px solid var(--tl);border-radius:16px;padding:14px 16px;--c:var(--ta)}
.rt .h{display:flex;align-items:center;gap:10px}
.rt .h b{font-size:15px}.rt .h .pc{margin-left:auto;font-family:var(--f-mono);font-size:12.5px;color:var(--tm)}
.rt .bar{background:#2c3248;margin:10px 0 6px;flex:none}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:10px}
.dy{background:var(--tv);border:1px solid var(--tl);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:7px;min-width:0}
.dy.today{border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
.dy .dn{font-size:11px;font-weight:800;color:var(--tm);display:flex;justify-content:space-between}
.dy.today .dn{color:var(--c)}
.dy input[type=text]{height:30px;border:1px dashed var(--tl);background:transparent;border-radius:8px;padding:0 7px;font-size:12px;color:var(--ti);width:100%;min-width:0}
.dy input[type=text]:focus{border-style:solid;border-color:var(--c);outline:none}
.dy .tg{height:30px;border-radius:8px;background:var(--tv3);color:var(--tm);font-size:11.5px;font-weight:800;display:grid;place-items:center;border:1px solid var(--tl)}
.dy .tg.done{background:var(--c);color:#241504;border-color:var(--c)}
.dy .tg[disabled]{opacity:.35;cursor:default}
.tro{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:10px}
.tro div{background:var(--tv2);border:1px solid var(--tl);border-radius:14px;padding:14px;text-align:center}
.tro div.off{opacity:.45}
.tro svg{width:46px;height:46px;margin:0 auto 6px;display:block}
.tro b{display:block;font-size:13px}.tro small{color:var(--tm);font-size:11.5px}


/* ---------- space station theme ---------- */
.starfield{position:absolute;left:0;top:0;width:1px;height:1px;background:transparent;display:none}
.moon{display:none}
.theme-space .starfield{display:block;animation:twinkle 7s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.7}to{opacity:1}}
.theme-space .cloud{display:none}
